name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compiler
        run: gradle assembleRelease --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk VolumeReveil.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeReveil-apk
          path: VolumeReveil.apk

      - name: Publier l'APK (lien direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Volume Réveil (build ${{ github.run_number }})
          files: VolumeReveil.apk
          make_latest: true
